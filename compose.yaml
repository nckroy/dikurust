services:
  dikumud:
    build: .
    image: dikumud:latest
    restart: unless-stopped
    ports:
      # Published on loopback only: put a TLS reverse proxy in front for
      # internet play. Change to "4000:4000" to expose it on the LAN.
      - "127.0.0.1:4000:4000"
    volumes:
      - dikumud-data:/var/lib/dikumud
    # The default json-file driver never rotates; cap the log at 30 MB.
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"

volumes:
  dikumud-data:
